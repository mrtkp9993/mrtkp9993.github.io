ooter><style>.project-image{object-fit:cover;border-radius:8px;width:250px;height:100px}#projects article{background-color:var(--c2-transparent);color:#fff;border-bottom:0px solid var(--c3);border-radius:8px;margin-bottom:1rem;padding:1rem}#projects article header{color:#fff;background-color:var(--c2);border-bottom:0px solid var(--c3);margin-bottom:.5rem;font-size:1.2rem;font-weight:700}#projects article p{color:#fff;border-bottom:0px solid var(--c3);margin:.5rem 0}#projects article footer{background-color:var(--c2);border-top:0px solid var(--c3);margin-top:.5rem}#projects hgroup{margin:0}</style><script>var toggleMenu=(()=>{const a=document.getElementById(`nav-links`);a.classList.toggle(`show`)});fetch(`/data/projects.json`).then(a=>a.json()).then(a=>{const b=document.getElementById(`projects`);a.forEach(a=>{const c=document.createElement(`article`);const d=document.createElement(`header`);d.textContent=a.title;c.appendChild(d);const e=document.createElement(`div`);e.innerHTML=`
